name: aw3d30-comparison
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis tools
        run: python -m pip install numpy scipy scikit-image pandas pyarrow rasterio matplotlib requests
      - name: Compare Copernicus, NASADEM and AW3D30
        run: >-
          python validation/nasadem_vs_copdem.py --aw3d30-comparison
          --copdem-cells data/j29/copdem.parquet
          --nasadem-cells data/j29/nasadem.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: aw3d30-comparison
          path: |
            data/validation/aw3d30_comparison.json
            docs/figures/aw3d30_comparison.png
          if-no-files-found: error
          retention-days: 30
